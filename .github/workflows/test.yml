name: PHP Integration Tests

on:
  push:
    branches: [main, develop, add_test]
  pull_request:
    branches: [main, develop, add_test]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: resume_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set working directory to backend
        run: cd backend-php

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer, phpunit

      - name: Install dependencies
        working-directory: backend-php
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL..."
          until mysqladmin ping -h 127.0.0.1 -u root -proot --silent; do
            sleep 2
          done

      - name: Run migrations
        working-directory: backend-php
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: resume_test
          DB_USERNAME: test
          DB_PASSWORD: test
        run: vendor/bin/phinx migrate -e testing

      - name: Run PHPUnit tests
        working-directory: backend-php
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: resume_test
          DB_USERNAME: test
          DB_PASSWORD: test
        run: vendor/bin/phpunit --configuration phpunit.xml.dist
