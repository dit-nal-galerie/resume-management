name: CI and Deploy

on:
  push:
    branches: ['main', 'add_test']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  # --- 🧪 Backend Tests ---
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_resume
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist
        working-directory: ./backend-php

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h127.0.0.1 -uroot -proot --silent; then
              echo "✅ MySQL is ready"
              break
            fi
            echo "⏳ Waiting for MySQL..."
            sleep 2
          done

      - name: Run migrations
        run: vendor/bin/phinx migrate -e testing
        working-directory: ./backend-php
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: test_resume
          DB_USER: test
          DB_PASS: test

      - name: Run tests
        run: composer test
        working-directory: ./backend-php
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: test_resume
          DB_USER: test
          DB_PASS: test

  # --- 🚀 Frontend Deploy to Vercel ---
  deploy:
    runs-on: ubuntu-latest
    needs: backend # erst deploy, wenn backend-tests OK
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci
        working-directory: ./frontend

      - name: Build
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          prod: true
